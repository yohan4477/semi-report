name: 포트폴리오 워치 갱신

# 부동산원 월간 통계가 보름께 나오므로 매달 20일에 돈다. 워치 줄(insights/watch/*.md)의
# 트리거가 새로 걸렸는지, 내가 본 뒤로 법이 개정됐는지를 이 워크플로가 대신 열어 본다 —
# 그전까지는 사람이 대시보드를 직접 열어야만 알 수 있었다
# (docs/superpowers/specs/2026-08-31-포트폴리오-워치-대시보드-design.md 「## 7. 한계」).
#
# REB_API_KEY 가 없으면 한국부동산원 API가 앞 몇 건만 돌려주고 그 뒤로도 계속 돈다 —
# 값이 조용히 낡는다. 그래서 여기서는 열쇠가 없으면 워크플로를 통째로 실패시킨다.
#
# check_watch.py가 FAIL을 내면 커밋하지 않는다 — 망가진 값을 대시보드에 올리지 않는다.
# watch_notify.py는 커밋 전에 돌려 insights/watch/_notified.json 을 새 상태로 다시 쓰고,
# 그 파일을 gen_watch_page.py 산출물과 한 커밋에 묶는다(다음 달 비교의 기준선이라
# 여기서 안 묶으면 커밋 없이 사라져 매달 같은 것을 "새로 걸렸다"고 다시 말하게 된다).

on:
  schedule:
    - cron: "0 0 20 * *"  # UTC 00:00 = KST 09:00, 매달 20일
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 열쇠 없이 돌면 앞 몇 건만 와서 값이 조용히 낡는다 — 여기서 막는다.
      - name: REB_API_KEY 확인
        run: |
          if [ -z "${{ secrets.REB_API_KEY }}" ]; then
            echo "::error::REB_API_KEY 가 비어 있다 — Settings → Secrets and variables → Actions 에 REB_API_KEY 를 넣어라. 열쇠 없이 돌면 한국부동산원 API가 앞 몇 건만 줘서 대시보드 값이 조용히 낡는다."
            exit 1
          fi

      # 부동산 권역·정책 시행일자를 받아 insights/watch/_metrics/ 에 쓴다. 줄어들면
      # 안 쓰고, 실패한 어댑터는 소리를 내며 건너뛴다 — insights/watch_fetch.py 자신의 계약.
      - name: 워치 수치 갱신
        env:
          PYTHONIOENCODING: utf-8
          REB_API_KEY: ${{ secrets.REB_API_KEY }}
          LAW_OC: ${{ secrets.LAW_OC }}
        run: python insights/watch_fetch.py

      - name: 대시보드 재생성
        env:
          PYTHONIOENCODING: utf-8
        run: python scratchpad/gen_watch_page.py

      # 문턱이 늘 걸려 있거나 닿을 수 없거나, 어댑터 열쇠가 실재하지 않으면 FAIL.
      # FAIL이면 여기서 멈추고 커밋하지 않는다.
      - name: 워치 검사
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python insights/check_watch.py | tee /tmp/watch_check.txt
          grep -q "FAIL 0" /tmp/watch_check.txt

      # 지난달 스냅숏(insights/watch/_notified.json)과 지금 상태를 견줘 새로 걸린 것만 골라
      # 낸다. 커밋 전에 돌리는 이유는 이 스크립트가 다시 쓰는 _notified.json 을 아래 커밋에
      # 같이 묶기 위해서다 — 안 묶으면 다음 실행이 같은 옛 기준선과 또 비교한다.
      # 제목·본문을 ${{ }} 로 run 스크립트에 바로 꽂지 않고 파일로 남긴다 — 워치 줄
      # 이름이나 조건 문장에 따옴표가 섞이면 그 보간이 셸 구문을 깬다.
      - name: 새로 걸린 것 계산
        id: notify
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/watch_notify.py --title-only > "$RUNNER_TEMP/watch_title.txt"
          python scripts/watch_notify.py > "$RUNNER_TEMP/watch_body.txt"
          if [ -s "$RUNNER_TEMP/watch_body.txt" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      # insights/watch_fetch.py 가 쓴 수치, gen_watch_page.py 가 다시 그린 화면,
      # watch_notify.py 가 다시 쓴 스냅숏을 한 커밋에 묶는다.
      - name: 변경 여부 확인
        id: diff
        run: |
          if git status --porcelain -uall -- insights/watch/_metrics "대시보드/포트폴리오 워치.html" insights/watch/_notified.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 커밋·푸시
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/watch/_metrics "대시보드/포트폴리오 워치.html" insights/watch/_notified.json
          git commit -m "chore(워치): 월간 수치·스냅숏 갱신 — $(TZ=Asia/Seoul date +%F)"
          git push

      # 이슈가 곧 알림이다 — 저장소 주인에게 GitHub이 메일을 보내니 비밀키가 따로
      # 필요 없다. 같은 달에 이미 연 watch 라벨 이슈가 있으면 새로 열지 않고 댓글로 단다.
      - name: 이슈로 알림
        if: steps.notify.outputs.has_body == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(TZ=Asia/Seoul date +%Y-%m)
          EXISTING=$(gh issue list --label watch --state open --json number,createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"${MONTH}\"))][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/watch_body.txt"
          else
            gh issue create --title "$(cat "$RUNNER_TEMP/watch_title.txt")" \
              --label watch --body-file "$RUNNER_TEMP/watch_body.txt"
          fi
