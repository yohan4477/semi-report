name: 포트폴리오 워치 알림

# 이 워크플로는 받지 않는다. 알리기만 한다.
#
# 처음엔 여기서 매달 20일 한국부동산원 API 를 불러 수치까지 받게 했다. 두 번 돌려 두 번 다
# 부동산원 쪽이 연결을 끊거나 타임아웃이었다(2026-09-02, run 33592254486 — 법령 API 는
# 통과). 해외 IP 를 막는 것이라 러너에서는 못 받는다. 그래서 받는 일은 한국에 있는 PC 가
# 작업 스케줄러로 한다(scripts/watch_local.ps1). 그 PC 가 _metrics 를 푸시하면 이 워크플로가
# 그 푸시에 반응해 「지난번 알린 뒤 새로 걸린 것」을 이슈로 연다.
#
# 이슈가 곧 알림이다 — 저장소 주인에게 GitHub 이 메일을 보내니 비밀키가 따로 안 든다.
# 기준선은 insights/watch/_notified.json(봇이 마지막으로 알린 상태)이다. 사람이 마지막으로
# 본 상태(_seen.json)와는 다른 파일이다 — 하나로 두면 알림이 확인을 대신해 버린다.
#
# check_watch.py 가 FAIL 이면 알리지 않는다 — 망가진 값으로 이슈를 열지 않는다.

on:
  push:
    branches: [main]
    paths:
      - "insights/watch/_metrics/**"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 문턱이 늘 걸려 있거나 닿을 수 없거나, 어댑터 열쇠가 실재하지 않으면 FAIL.
      - name: 워치 검사
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python insights/check_watch.py | tee /tmp/watch_check.txt
          grep -q "FAIL 0" /tmp/watch_check.txt

      # 지난번 알린 스냅숏(_notified.json)과 지금 상태를 견줘 새로 걸린 것만 골라 낸다.
      # 이 스크립트가 _notified.json 을 다시 쓰므로 아래에서 커밋한다 — 안 묶으면 다음
      # 실행이 같은 옛 기준선과 또 비교해 매달 같은 것을 「새로 걸렸다」고 말한다.
      # 제목·본문을 ${{ }} 로 run 스크립트에 바로 꽂지 않고 파일로 남긴다 — 워치 줄
      # 이름이나 조건 문장에 따옴표가 섞이면 그 보간이 셸 구문을 깬다.
      - name: 새로 걸린 것 계산
        id: notify
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/watch_notify.py --title-only > "$RUNNER_TEMP/watch_title.txt"
          python scripts/watch_notify.py > "$RUNNER_TEMP/watch_body.txt"
          if [ -s "$RUNNER_TEMP/watch_body.txt" ]; then
            echo "has_body=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_body=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 기준선 커밋
        run: |
          if git status --porcelain -- insights/watch/_notified.json | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add insights/watch/_notified.json
            git commit -m "chore(워치): 알림 기준선 갱신 — $(TZ=Asia/Seoul date +%F)"
            git push
          fi

      # 같은 달에 이미 연 watch 라벨 이슈가 있으면 새로 열지 않고 댓글로 단다.
      - name: 이슈로 알림
        if: steps.notify.outputs.has_body == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MONTH=$(TZ=Asia/Seoul date +%Y-%m)
          EXISTING=$(gh issue list --label watch --state open --json number,createdAt \
            --jq "[.[] | select(.createdAt | startswith(\"${MONTH}\"))][0].number")
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --body-file "$RUNNER_TEMP/watch_body.txt"
          else
            gh issue create --title "$(cat "$RUNNER_TEMP/watch_title.txt")" \
              --label watch --body-file "$RUNNER_TEMP/watch_body.txt"
          fi
