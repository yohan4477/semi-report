name: 회계사 시세 갱신

# 매 영업일 한국 장 마감 뒤에 회계사 대시보드에 선 회사들의 종가를 받아 온다.
# 대시보드의 「지금 대비」 칸이 이 값으로 다시 계산된다 — 필자가 낸 괴리율은 그 글의 시점
# 기준이라, 그사이 주가가 움직이면 지금 어느 쪽인지가 화면에서 안 읽히기 때문이다.
#
# market.yml(16:30 KST)보다 뒤에 둔다. 둘이 같은 시각에 같은 브랜치로 밀면 한쪽이 막힌다.
# 휴장일이나 값이 그대로면 fetch_prices.py가 파일을 안 고치므로 diff가 없어 커밋도 건너뛴다.

on:
  schedule:
    - cron: "45 7 * * 1-5"  # UTC 07:45 = KST 16:45, 월~금
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # 브라우저도 모델도 안 쓴다. 페이지가 서버에서 완성돼 오므로 HTTP로 받아 읽는다.
      - name: 시세 수집
        env:
          PYTHONIOENCODING: utf-8
        run: python scratchpad/fetch_prices.py

      # 「지금 대비」는 만들 때 계산해 HTML에 박히므로, 시세만 갱신하면 화면이 안 바뀐다.
      - name: 회계사 대시보드 재생성
        env:
          PYTHONIOENCODING: utf-8
        working-directory: scratchpad
        run: python gen_accountant_dashboard.py

      # 대시보드 산문도 검사기를 탄다. FAIL이면 여기서 멈추고 커밋하지 않는다.
      - name: 산문 검사
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python insights/check_prose.py | tee /tmp/prose.txt
          grep -q "FAIL 0" /tmp/prose.txt

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet -- insights/prices.json "대시보드/회계사 대시보드.html"; then
            echo "바뀐 값이 없다 — 커밋 건너뜀"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add insights/prices.json "대시보드/회계사 대시보드.html"
          git commit -m "chore(회계사): 시세 갱신 — $(date -u +%Y-%m-%d)"
          git push
