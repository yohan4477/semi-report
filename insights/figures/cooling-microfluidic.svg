<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4231f"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f6b41"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f9c"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c8752a" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1000" height="620" fill="#fbfaf8"/>

  <text x="40" y="38" font-size="19" font-weight="700" fill="#16181d">칩을 식히는 두 가지 방법</text>
  <text x="40" y="60" font-size="13" fill="#5d636e">단면도 · 열은 아래(칩)에서 위(물)로 빠져나간다</text>

  <!-- ========== PANEL A : stack x 60..360, label gutter x 372..470 ========== -->
  <text x="40" y="100" font-size="14" font-weight="700" fill="#16181d">지금 방식 — 칩 위에 금속판을 얹고 물을 흘림</text>
  <text x="40" y="119" font-size="12" fill="#5d636e">DLC</text>

  <rect x="60" y="140" width="300" height="36" fill="#dbeaf4" stroke="#9dbdd2"/>
  <line x1="240" y1="158" x2="344" y2="158" stroke="#1f6f9c" stroke-width="1.6" marker-end="url(#aw)"/>
  <rect x="60" y="176" width="300" height="32" fill="#e6e7ea" stroke="#9ea3ac"/>
  <rect x="60" y="208" width="300" height="12" fill="url(#hatch)" stroke="#c8752a"/>
  <rect x="60" y="220" width="300" height="72" fill="#f3f1ee" stroke="#b9b3aa"/>
  <rect x="70" y="228" width="52" height="56" fill="#dcd3e6" stroke="#8d7fa5"/>
  <text x="96" y="261" font-size="11.5" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
  <rect x="138" y="228" width="144" height="56" fill="#cfd6de" stroke="#7f8996"/>
  <text x="210" y="261" font-size="12.5" font-weight="700" fill="#2b3441" text-anchor="middle">GPU 칩</text>
  <rect x="298" y="228" width="52" height="56" fill="#dcd3e6" stroke="#8d7fa5"/>
  <text x="324" y="261" font-size="11.5" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
  <rect x="60" y="292" width="300" height="20" fill="#d8d2c8" stroke="#a89f92"/>

  <!-- heat arrows A : x 100 / 210 / 322, clear of all text -->
  <line x1="100" y1="228" x2="100" y2="196" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="210" y1="228" x2="210" y2="196" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="322" y1="228" x2="322" y2="196" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- gutter labels A -->
  <g font-size="10.5" fill="#5d636e" stroke="none">
    <line x1="360" y1="158" x2="370" y2="158" stroke="#c3bdb4"/><text x="374" y="162">물</text>
    <line x1="360" y1="192" x2="370" y2="192" stroke="#c3bdb4"/><text x="374" y="196">금속 냉각판</text>
    <line x1="360" y1="214" x2="370" y2="214" stroke="#c8752a"/><text x="374" y="218" fill="#8a5a1e">접착제 TIM</text>
    <line x1="360" y1="256" x2="370" y2="256" stroke="#c3bdb4"/><text x="374" y="260">패키지</text>
    <line x1="360" y1="302" x2="370" y2="302" stroke="#c3bdb4"/><text x="374" y="306">기판</text>
  </g>

  <!-- ========== PANEL B : stack x 550..850, gutter x 862..960 ========== -->
  <text x="530" y="100" font-size="14" font-weight="700" fill="#16181d">새 방식 — 접착제를 걷어내고 그 자리로 물을 직접 흘림</text>
  <text x="530" y="119" font-size="12" fill="#5d636e">마이크로플루이딕 · 칩 윗면(배면)을 깎아 물길을 냄 · TSMC·MS 시제품</text>

  <rect x="550" y="140" width="300" height="36" fill="#dbeaf4" stroke="#9dbdd2"/>
  <line x1="730" y1="158" x2="834" y2="158" stroke="#1f6f9c" stroke-width="1.6" marker-end="url(#aw)"/>
  <!-- 냉각판은 HBM 위에만 남고, GPU 위는 물이 내려오는 통로 -->
  <rect x="550" y="176" width="78" height="32" fill="#e6e7ea" stroke="#9ea3ac"/>
  <rect x="772" y="176" width="78" height="32" fill="#e6e7ea" stroke="#9ea3ac"/>
  <rect x="628" y="176" width="144" height="52" fill="#dbeaf4" stroke="#2f6b41" stroke-dasharray="5 3"/>
  <line x1="700" y1="182" x2="700" y2="222" stroke="#1f6f9c" stroke-width="1.6" marker-end="url(#aw)"/>
  <!-- TIM은 HBM 위에만 남음 -->
  <rect x="550" y="208" width="78" height="12" fill="url(#hatch)" stroke="#c8752a"/>
  <rect x="772" y="208" width="78" height="12" fill="url(#hatch)" stroke="#c8752a"/>

  <rect x="550" y="220" width="300" height="72" fill="#f3f1ee" stroke="#b9b3aa"/>
  <rect x="560" y="228" width="52" height="56" fill="#dcd3e6" stroke="#8d7fa5"/>
  <text x="586" y="261" font-size="11.5" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
  <rect x="628" y="228" width="144" height="56" fill="#cfd6de" stroke="#7f8996"/>
  <!-- 칩 윗면을 깎아낸 홈 — 물이 실리콘에 직접 닿는다 -->
  <g fill="#dbeaf4" stroke="#1f6f9c" stroke-width="1">
    <rect x="637" y="228" width="12" height="15"/>
    <rect x="654" y="228" width="12" height="15"/>
    <rect x="671" y="228" width="12" height="15"/>
    <rect x="688" y="228" width="12" height="15"/>
    <rect x="705" y="228" width="12" height="15"/>
    <rect x="722" y="228" width="12" height="15"/>
    <rect x="739" y="228" width="12" height="15"/>
    <rect x="756" y="228" width="12" height="15"/>
  </g>
  <text x="700" y="272" font-size="12.5" font-weight="700" fill="#2b3441" text-anchor="middle">GPU 칩</text>
  <rect x="788" y="228" width="52" height="56" fill="#dcd3e6" stroke="#8d7fa5"/>
  <text x="814" y="261" font-size="11.5" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
  <rect x="550" y="292" width="300" height="20" fill="#d8d2c8" stroke="#a89f92"/>

  <!-- heat arrows B : 홈 바닥에서 곧장 물로 / HBM은 접착제 경유 -->
  <line x1="663" y1="258" x2="663" y2="232" stroke="#2f6b41" stroke-width="2.4" marker-end="url(#ag)"/>
  <line x1="731" y1="258" x2="731" y2="232" stroke="#2f6b41" stroke-width="2.4" marker-end="url(#ag)"/>
  <line x1="590" y1="228" x2="590" y2="196" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="812" y1="228" x2="812" y2="196" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>

  <!-- gutter labels B -->
  <g font-size="10.5" fill="#5d636e" stroke="none">
    <line x1="850" y1="158" x2="860" y2="158" stroke="#c3bdb4"/><text x="864" y="162">물</text>
    <line x1="850" y1="192" x2="860" y2="192" stroke="#c3bdb4"/><text x="864" y="196">냉각판(HBM만)</text>
    <line x1="850" y1="214" x2="860" y2="214" stroke="#c8752a"/><text x="864" y="218" fill="#8a5a1e">접착제 TIM</text>
    <line x1="850" y1="256" x2="860" y2="256" stroke="#c3bdb4"/><text x="864" y="260">패키지</text>
    <line x1="850" y1="302" x2="860" y2="302" stroke="#c3bdb4"/><text x="864" y="306">기판</text>
  </g>
  <text x="700" y="333" font-size="10.5" font-weight="700" fill="#2f6b41" text-anchor="middle">물이 칩 윗면 홈까지 내려와 실리콘에 직접 닿는다</text>

  <!-- ========== LEGEND ========== -->
  <g font-size="11" fill="#4b5058">
    <rect x="60" y="352" width="16" height="11" fill="url(#hatch)" stroke="#c8752a"/>
    <text x="84" y="362">접착제 있음 — 열이 여기서 걸린다</text>
    <rect x="300" y="352" width="16" height="11" fill="#dbeaf4" stroke="#2f6b41" stroke-dasharray="3 2"/>
    <text x="324" y="362">접착제 걷어낸 자리 — 물이 그 자리로</text>
    <line x1="560" y1="362" x2="580" y2="362" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
    <text x="590" y="366">막히는 열 경로</text>
    <line x1="700" y1="362" x2="720" y2="362" stroke="#2f6b41" stroke-width="2.4" marker-end="url(#ag)"/>
    <text x="730" y="366">뚫린 열 경로</text>
  </g>

  <!-- ========== ANNOTATION BOXES ========== -->
  <rect x="40" y="384" width="430" height="82" fill="#fff" stroke="#ded9d2"/>
  <text x="58" y="408" font-size="13" font-weight="700" fill="#16181d">4리터 넘게 흘려도 더 안 식는다</text>
  <text x="58" y="430" font-size="12" fill="#4b5058">뽑아내는 열이 4kW에서 멈춘다. 물을 더 부어도</text>
  <text x="58" y="450" font-size="12" fill="#4b5058">접착제가 막고 있어 소용이 없다.</text>

  <rect x="530" y="384" width="430" height="82" fill="#fff" stroke="#ded9d2"/>
  <text x="548" y="408" font-size="13" font-weight="700" fill="#16181d">8리터로 올리면 5.3kW까지 계속 올라간다</text>
  <text x="548" y="430" font-size="12" fill="#4b5058">GPU 쪽 열 저항 51~60% 감소. HBM은 27~37%로</text>
  <text x="548" y="450" font-size="12" fill="#4b5058">효과가 절반 — 위에 냉각판·접착제가 그대로라서.</text>

  <!-- ========== BOTTOM NOTES ========== -->
  <rect x="40" y="490" width="920" height="98" fill="#f5f2ee" stroke="#e2ddd5"/>
  <text x="60" y="516" font-size="13" font-weight="700" fill="#16181d">아직 실험실 물건이다</text>
  <text x="60" y="538" font-size="12" fill="#4b5058">공장에서 대량으로 찍을 때 몇 개나 멀쩡한지(수율), 물이 새거나 물길이 막히지 않는지 — 두 회사 다 공개하지 않았다.</text>
  <text x="60" y="558" font-size="12" fill="#4b5058">넘어오는 순간 금속판·물 배관 장비를 파는 회사(Vertiv·Schneider)의 몫이 줄어든다.</text>
  <text x="60" y="578" font-size="10.5" fill="#7c828c">근거: ECTC 2026 총정리 (26-07-02) — TSMC는 실리콘 표면에 미세기둥을 세워 물을 칩 배면 바로 옆까지(CoWoS-R, 4 SoC+8 HBM, 40℃ 냉각수), MS는 GH200 실리콘에 직선 홈을 식각(1L·분)</text>
</svg>
