<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="980" height="600" font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4231f"/>
    </marker>
    <marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6f9c"/>
    </marker>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#c8752a" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="980" height="600" fill="#fbfaf8"/>

  <text x="40" y="40" font-size="19" font-weight="700" fill="#16181d">칩을 식히는 두 가지 방법</text>
  <text x="40" y="62" font-size="13" fill="#5d636e">단면도 · 열은 아래(칩)에서 위(물)로 빠져나간다</text>

  <!-- ================= PANEL A ================= -->
  <g>
    <text x="40" y="106" font-size="14" font-weight="700" fill="#16181d">지금 방식 — 칩 위에 금속판을 얹고 물을 흘림</text>
    <text x="40" y="126" font-size="12" fill="#5d636e">DLC (Direct Liquid Cooling)</text>

    <!-- water channel -->
    <rect x="60" y="150" width="380" height="34" fill="#dbeaf4" stroke="#9dbdd2"/>
    <text x="70" y="172" font-size="12" fill="#1f6f9c">물 (냉각수)</text>
    <line x1="300" y1="167" x2="420" y2="167" stroke="#1f6f9c" stroke-width="1.6" marker-end="url(#aw)"/>

    <!-- cold plate -->
    <rect x="60" y="184" width="380" height="30" fill="#e6e7ea" stroke="#9ea3ac"/>
    <text x="70" y="204" font-size="12" fill="#4b5058">금속 냉각판</text>

    <!-- TIM -->
    <rect x="60" y="214" width="380" height="11" fill="url(#hatch)" stroke="#c8752a"/>
    <text x="452" y="223" font-size="12" font-weight="700" fill="#b4231f">← 여기서 열이 걸린다</text>
    <text x="70" y="243" font-size="11.5" fill="#8a5a1e">열전도 접착제 (TIM) — 칩과 판을 붙이는 얇은 층</text>

    <!-- package -->
    <rect x="60" y="252" width="380" height="70" fill="#f3f1ee" stroke="#b9b3aa"/>
    <rect x="150" y="262" width="200" height="50" fill="#cfd6de" stroke="#7f8996"/>
    <text x="250" y="292" font-size="13" font-weight="700" fill="#2b3441" text-anchor="middle">GPU 연산 칩</text>
    <rect x="74" y="262" width="66" height="50" fill="#dcd3e6" stroke="#8d7fa5"/>
    <text x="107" y="286" font-size="12" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
    <text x="107" y="301" font-size="10" fill="#6b5f80" text-anchor="middle">메모리</text>
    <rect x="360" y="262" width="66" height="50" fill="#dcd3e6" stroke="#8d7fa5"/>
    <text x="393" y="286" font-size="12" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
    <text x="393" y="301" font-size="10" fill="#6b5f80" text-anchor="middle">메모리</text>

    <!-- substrate -->
    <rect x="60" y="322" width="380" height="18" fill="#d8d2c8" stroke="#a89f92"/>
    <text x="70" y="336" font-size="11" fill="#6f675c">기판</text>

    <!-- heat arrows -->
    <line x1="250" y1="262" x2="250" y2="228" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="107" y1="262" x2="107" y2="228" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="393" y1="262" x2="393" y2="228" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>

    <!-- annotation -->
    <rect x="60" y="368" width="380" height="76" fill="#fff" stroke="#ded9d2"/>
    <text x="76" y="392" font-size="13" font-weight="700" fill="#16181d">물을 분당 4리터 넘게 흘려도 더 안 식는다</text>
    <text x="76" y="414" font-size="12.5" fill="#4b5058">뽑아내는 열이 <tspan font-weight="700" fill="#16181d">4kW</tspan>에서 멈춘다. 물을 더 부어도</text>
    <text x="76" y="432" font-size="12.5" fill="#4b5058">접착제가 막고 있어서 소용이 없다.</text>
  </g>

  <line x1="470" y1="96" x2="470" y2="450" stroke="#ded9d2"/>

  <!-- ================= PANEL B ================= -->
  <g>
    <text x="500" y="106" font-size="14" font-weight="700" fill="#16181d">새 방식 — 칩 안쪽에 물길을 파서 접착제를 건너뜀</text>
    <text x="500" y="126" font-size="12" fill="#5d636e">마이크로플루이딕 (TSMC 시제품 · MS GH200 시제품)</text>

    <rect x="520" y="150" width="380" height="34" fill="#dbeaf4" stroke="#9dbdd2"/>
    <text x="530" y="172" font-size="12" fill="#1f6f9c">물 (냉각수)</text>
    <line x1="760" y1="167" x2="880" y2="167" stroke="#1f6f9c" stroke-width="1.6" marker-end="url(#aw)"/>

    <rect x="520" y="184" width="380" height="30" fill="#e6e7ea" stroke="#9ea3ac"/>
    <text x="530" y="204" font-size="12" fill="#4b5058">금속 냉각판</text>

    <!-- TIM: only under HBM -->
    <rect x="520" y="214" width="86" height="11" fill="url(#hatch)" stroke="#c8752a"/>
    <rect x="814" y="214" width="86" height="11" fill="url(#hatch)" stroke="#c8752a"/>
    <rect x="606" y="214" width="208" height="11" fill="none" stroke="#8aa88f" stroke-dasharray="4 3"/>
    <text x="710" y="243" font-size="11.5" font-weight="700" fill="#2f6b41" text-anchor="middle">GPU 위 접착제 없음</text>
    <text x="563" y="243" font-size="11" fill="#8a5a1e" text-anchor="middle">접착제 남음</text>
    <text x="857" y="243" font-size="11" fill="#8a5a1e" text-anchor="middle">접착제 남음</text>

    <rect x="520" y="252" width="380" height="70" fill="#f3f1ee" stroke="#b9b3aa"/>
    <rect x="610" y="262" width="200" height="50" fill="#cfd6de" stroke="#7f8996"/>

    <!-- micro channels inside GPU die -->
    <g fill="#bcd9ec" stroke="#1f6f9c" stroke-width="1">
      <rect x="620" y="268" width="14" height="16" rx="3"/>
      <rect x="643" y="268" width="14" height="16" rx="3"/>
      <rect x="666" y="268" width="14" height="16" rx="3"/>
      <rect x="689" y="268" width="14" height="16" rx="3"/>
      <rect x="712" y="268" width="14" height="16" rx="3"/>
      <rect x="735" y="268" width="14" height="16" rx="3"/>
      <rect x="758" y="268" width="14" height="16" rx="3"/>
      <rect x="781" y="268" width="14" height="16" rx="3"/>
    </g>
    <text x="710" y="302" font-size="13" font-weight="700" fill="#2b3441" text-anchor="middle">GPU 연산 칩 — 안쪽에 물길</text>

    <rect x="534" y="262" width="66" height="50" fill="#dcd3e6" stroke="#8d7fa5"/>
    <text x="567" y="286" font-size="12" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
    <text x="567" y="301" font-size="10" fill="#6b5f80" text-anchor="middle">메모리</text>
    <rect x="820" y="262" width="66" height="50" fill="#dcd3e6" stroke="#8d7fa5"/>
    <text x="853" y="286" font-size="12" font-weight="700" fill="#4b3f60" text-anchor="middle">HBM</text>
    <text x="853" y="301" font-size="10" fill="#6b5f80" text-anchor="middle">메모리</text>

    <rect x="520" y="322" width="380" height="18" fill="#d8d2c8" stroke="#a89f92"/>
    <text x="530" y="336" font-size="11" fill="#6f675c">기판</text>

    <!-- heat: GPU straight into channels (short), HBM still through TIM -->
    <line x1="710" y1="268" x2="710" y2="230" stroke="#2f6b41" stroke-width="2.4" marker-end="url(#ar)"/>
    <line x1="567" y1="262" x2="567" y2="228" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>
    <line x1="853" y1="262" x2="853" y2="228" stroke="#b4231f" stroke-width="2" marker-end="url(#ar)"/>

    <rect x="520" y="368" width="380" height="76" fill="#fff" stroke="#ded9d2"/>
    <text x="536" y="392" font-size="13" font-weight="700" fill="#16181d">물을 8리터로 올리면 5.3kW까지 계속 올라간다</text>
    <text x="536" y="414" font-size="12.5" fill="#4b5058">GPU 쪽 열 저항 <tspan font-weight="700" fill="#2f6b41">51~60% 감소</tspan>.</text>
    <text x="536" y="432" font-size="12.5" fill="#4b5058">HBM은 <tspan font-weight="700" fill="#8a5a1e">27~37%</tspan> — 접착제를 여전히 거쳐서 효과가 절반.</text>
  </g>

  <!-- bottom notes -->
  <rect x="40" y="470" width="900" height="96" fill="#f5f2ee" stroke="#e2ddd5"/>
  <text x="60" y="496" font-size="13" font-weight="700" fill="#16181d">아직 실험실 물건이다</text>
  <text x="60" y="518" font-size="12.5" fill="#4b5058">공장에서 대량으로 찍을 때 몇 개나 멀쩡한지(수율), 물이 새거나 물길이 막히지 않는지 — 두 회사 다 공개하지 않았다.</text>
  <text x="60" y="538" font-size="12.5" fill="#4b5058">넘어오는 순간 지금 금속판·물 배관 장비를 파는 회사(Vertiv·Schneider — 데이터센터 전기·냉각 설비 업체)의 몫이 줄어든다.</text>
  <text x="60" y="558" font-size="11" fill="#7c828c">근거: ECTC 2026 총정리 (26-07-02) — TSMC CoWoS-R 4 SoC+8 HBM 구성, 40℃ 냉각수 기준 / MS GH200 미세채널 1L·분</text>
</svg>
