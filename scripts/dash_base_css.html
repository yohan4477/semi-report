<style>

  /* ============ 측정된 지식 저널 — 딥 파인 · 샌드 · 데이터 스트립 ============ */
  :root {
    --paper:#f7f8fa; --surface:#ffffff; --sunk:#eef1f5;
    --ink:#1a2233; --ink-2:#5b6577; --ink-3:#8892a3; --line:#e3e7ee;
    --accent:#2563eb; --accent-ink:#1e40af; --accent-soft:#eaf1fe;
    --good:#16a34a; --good-soft:#e8f6ec;
    --warn:#d97706; --warn-soft:#fdf1df;
    --risk:#dc2626; --risk-soft:#fdeaea;
    --shadow:0 1px 2px rgba(26,34,51,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper:#12151c; --surface:#1a1f2a; --sunk:#242b38;
      --ink:#e8ecf4; --ink-2:#9aa5b8; --ink-3:#7e8798; --line:#2a3140;
      --accent:#7aa5f8; --accent-ink:#9ab8fa; --accent-soft:#1e2a44;
      --good:#5ecb84; --good-soft:#173323;
      --warn:#f0a44e; --warn-soft:#3a2c17;
      --risk:#f87171; --risk-soft:#3a1a1a;
      --shadow:none;
    }
  }
  :root[data-theme="light"] {
    --paper:#f7f8fa; --surface:#ffffff; --sunk:#eef1f5;
    --ink:#1a2233; --ink-2:#5b6577; --ink-3:#8892a3; --line:#e3e7ee;
    --accent:#2563eb; --accent-ink:#1e40af; --accent-soft:#eaf1fe;
    --good:#16a34a; --good-soft:#e8f6ec;
    --warn:#d97706; --warn-soft:#fdf1df;
    --risk:#dc2626; --risk-soft:#fdeaea;
    --shadow:0 1px 2px rgba(26,34,51,.05);
  }
  :root[data-theme="dark"] {
    --paper:#12151c; --surface:#1a1f2a; --sunk:#242b38;
    --ink:#e8ecf4; --ink-2:#9aa5b8; --ink-3:#7e8798; --line:#2a3140;
    --accent:#7aa5f8; --accent-ink:#9ab8fa; --accent-soft:#1e2a44;
    --good:#5ecb84; --good-soft:#173323;
    --warn:#f0a44e; --warn-soft:#3a2c17;
    --risk:#f87171; --risk-soft:#3a1a1a;
    --shadow:none;
  }

  * { box-sizing:border-box; }
  body {
    background:var(--paper); color:var(--ink);
    font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
    line-height:1.64; margin:0; padding:0 20px 80px; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:840px; margin:0 auto; }

  /* ── header ── */
  header { padding:52px 0 4px; }
  .eyebrow {
    font-size:11.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin:0 0 14px;
  }
  h1 {
    font-size:clamp(30px,6vw,46px); font-weight:850; letter-spacing:-.035em;
    line-height:1.04; margin:0 0 4px; text-wrap:balance;
  }
  h1::after {
    content:""; display:block; width:52px; height:3px; background:var(--accent);
    margin-top:16px; border-radius:2px;
  }
  .lede { color:var(--ink-2); font-size:15px; margin:16px 0 0; max-width:60ch; line-height:1.6; }
  .meta-row {
    display:flex; flex-wrap:wrap; gap:6px 22px;
    margin:22px 0 0; padding:14px 0 0; border-top:1px solid var(--line);
    font-size:12.5px; color:var(--ink-3); font-variant-numeric:tabular-nums;
    letter-spacing:.01em;
  }
  .meta-row b { color:var(--ink-2); font-weight:700; }

  /* ── non-corpus banner ── */
  .noncorpus {
    margin:20px 0 0; padding:14px 17px;
    background:var(--sunk); border:1px solid var(--line); border-left:3px solid var(--warn);
    border-radius:4px; font-size:13px; color:var(--ink-2); line-height:1.62;
  }
  .noncorpus .nc-tag {
    display:block; font-size:10.5px; font-weight:800; color:var(--warn);
    letter-spacing:.1em; text-transform:uppercase; margin-bottom:6px;
  }
  .noncorpus .nc-tag::before { content:none; }
  .noncorpus b { color:var(--ink); font-weight:700; }

  /* ── sections (출연자 = 구조, 순서 아님) ── */
  section { margin-top:56px; }
  .sec-head { display:flex; align-items:baseline; gap:11px; margin-bottom:5px; }
  .sec-num {
    font-size:11px; font-weight:800; color:var(--accent);
    font-variant-numeric:tabular-nums; letter-spacing:.08em;
    border:1px solid var(--accent-soft); background:var(--accent-soft);
    border-radius:4px; padding:2px 7px;
  }
  h2.sec-title { font-size:22px; font-weight:800; letter-spacing:-.02em; margin:0; }
  .sec-sub { color:var(--ink-3); font-size:13px; margin:0 0 22px; letter-spacing:.01em; }

  .uc-series { display:inline-block; font-size:10px; font-weight:800; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-3); margin:0 0 9px; }
  .uc-series::before { content:"\25C6  "; color:var(--accent); }

  /* ── cards ── */
  .ucard {
    background:var(--surface); border:1px solid var(--line);
    border-radius:8px; padding:26px 26px 22px; margin-bottom:16px; box-shadow:var(--shadow);
  }
  .uc-topic {
    display:inline-block; font-size:10.5px; font-weight:800; white-space:nowrap;
    letter-spacing:.09em; text-transform:uppercase;
    padding:0 0 3px; border-bottom:2px solid var(--accent);
    color:var(--accent); margin-bottom:13px;
  }
  .uc-topic::before { content:none; }
  .uc-topic.market { color:var(--warn); border-color:var(--warn); }

  .ucard h2 {
    font-size:23px; font-weight:850; letter-spacing:-.025em;
    /* balance는 줄 길이를 고르게 맞추려고 오른쪽 자리를 남긴 채 줄을 바꾼다.
       카드 제목은 폭을 끝까지 쓰는 게 낫다 — pretty는 마지막 한 글자만 방지한다 */
    line-height:1.28; margin:0 0 10px; text-wrap:pretty; color:var(--ink);
  }
  .uc-meta {
    display:flex; flex-wrap:wrap; gap:3px 8px; font-size:12px; color:var(--ink-3);
    font-variant-numeric:tabular-nums; margin:0 0 18px; padding-bottom:16px;
    border-bottom:1px solid var(--line); letter-spacing:.01em;
  }
  .uc-meta span:not(:last-child)::after { content:"·"; margin-left:8px; color:var(--line); }
  .uc-meta b { color:var(--ink-2); font-weight:700; }

  .uc-oneliner {
    font-size:16.5px; color:var(--ink); font-weight:750; line-height:1.5;
    margin:0 0 20px; padding-left:15px; border-left:3px solid var(--accent);
    letter-spacing:-.01em;
  }

  .uc-points { margin:0 0 22px; padding:0; list-style:none; display:flex; flex-direction:column; gap:10px; }
  .uc-points li { position:relative; padding-left:18px; font-size:13.5px; color:var(--ink-2); line-height:1.58; }
  .uc-points li::before {
    content:""; position:absolute; left:1px; top:9px; width:7px; height:1.5px; background:var(--accent);
  }
  .uc-points li b { color:var(--ink); font-weight:700; }

  .uc-label {
    font-size:10.5px; font-weight:800; color:var(--ink-3);
    letter-spacing:.12em; text-transform:uppercase; margin:0 0 10px;
  }

  /* signature: 숫자 데이터 스트립 */
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:0; margin-bottom:22px;
    border-top:1px solid var(--ink); border-bottom:1px solid var(--line); }
  @media (max-width:480px) { .stat-grid { grid-template-columns:1fr; } }
  .stat { padding:13px 14px 12px; border-bottom:1px solid var(--line); }
  .stat:nth-child(odd) { border-right:1px solid var(--line); }
  .stat:last-child, .stat:nth-last-child(2):nth-child(odd) { border-bottom:none; }
  .stat .s-val {
    font-size:19px; font-weight:800; color:var(--accent-ink);
    font-variant-numeric:tabular-nums; line-height:1.2; letter-spacing:-.02em;
  }
  .stat .s-label { font-size:11px; color:var(--ink-3); margin-top:4px; line-height:1.4; }

  .uc-quote {
    font-size:13px; color:var(--ink-2); font-style:italic;
    background:var(--sunk); border-radius:6px; padding:11px 14px; margin:0 0 20px;
  }

  .uc-links { display:flex; flex-wrap:wrap; gap:9px; }
  .uc-links a {
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:750;
    text-decoration:none; letter-spacing:.01em;
    color:var(--surface); background:var(--accent); border:1px solid var(--accent);
    border-radius:6px; padding:8px 15px;
  }
  .uc-links a.secondary { color:var(--accent); background:transparent; border-color:var(--line); }
  @media (prefers-reduced-motion: no-preference) {
    .uc-links a { transition:transform .12s ease, opacity .15s ease; }
    .uc-links a:hover { transform:translateY(-1px); opacity:.9; }
  }

  /* 같은 영상에서 나온 카드 — 한 편이 여러 장으로 갈릴 때 읽는 순서를 카드 안에서 잇는다 */
  .uc-kin { margin:0 0 18px; }
  .uc-kin .kin-g { border-left:2px solid var(--line); padding-left:13px; margin-bottom:12px; }
  .uc-kin .kin-g:last-child { margin-bottom:0; }
  .uc-kin .kin-src { font-size:11.5px; font-weight:750; color:var(--ink-3); margin:0 0 6px; }
  .uc-kin ol { margin:0; padding-left:19px; }
  .uc-kin li { font-size:12.5px; line-height:1.6; color:var(--ink-2); margin-bottom:4px; }
  .uc-kin li:last-child { margin-bottom:0; }
  .uc-kin li.is-here { color:var(--ink); font-weight:700; }
  .uc-kin .kin-now { font-size:10.5px; font-weight:800; color:var(--ink-3); margin-left:6px; letter-spacing:.04em; }
  .uc-kin a.kin-link { color:var(--accent-ink); text-decoration:none; border-bottom:1px solid var(--line); }
  .uc-kin a.kin-link:hover { border-bottom-color:var(--accent); }

  .side-note {
    margin-top:0; font-size:12.5px; color:var(--ink-3);
    background:var(--sunk); border-radius:6px; padding:12px 15px; line-height:1.6;
  }

  footer {
    margin-top:60px; padding-top:18px; border-top:2px solid var(--ink);
    font-size:12px; color:var(--ink-3); line-height:1.7;
  }

  @media (prefers-reduced-motion: no-preference) {
    .ucard { transition:border-color .3s cubic-bezier(.32,.72,0,1), box-shadow .3s cubic-bezier(.32,.72,0,1); }
    .ucard:hover { border-color:var(--ink-3); box-shadow:0 6px 22px rgba(26,34,51,.08); }
  }

  /* apple-design: 진입 리빌 · 프레스 피드백 · 접근성 */
  body.anim .ucard { opacity:0; transform:translateY(14px); will-change:opacity, transform; }
  body.anim .ucard.in {
    opacity:1; transform:none;
    transition:opacity .55s cubic-bezier(.32,.72,0,1), transform .55s cubic-bezier(.32,.72,0,1);
  }
  .uc-links a:active { transform:scale(.96); transition:transform 80ms ease-out; }
  @media (prefers-reduced-motion: reduce) {
    body.anim .ucard, body.anim .ucard.in { opacity:1; transform:none; transition:none; }
    .ucard { transition:none; }
  }
  @media (prefers-contrast: more) {
    .ucard, .stat, .noncorpus, .side-note, .uc-quote { border:1px solid var(--ink-3); }
  }

  /* ── 섹션 점프 내비 ── */
  .sec-nav {
    position:sticky; top:0; z-index:20;
    display:flex; gap:8px; flex-wrap:wrap;
    padding:11px 0 10px; margin:0 0 6px;
    background:var(--paper); border-bottom:1px solid var(--line);
  }
  .sec-nav a {
    display:inline-flex; align-items:center; gap:7px;
    padding:7px 14px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line);
    color:var(--ink-2); font-size:12.5px; font-weight:750;
    text-decoration:none; white-space:nowrap; transition:border-color .15s, color .15s;
  }
  .sec-nav a:hover { border-color:var(--accent); color:var(--accent); }
  .sec-nav a.active { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); font-weight:800; }
  .sec-nav a b { font-size:10.5px; font-weight:800; color:var(--ink-3); }
  .sec-nav a.active b { color:var(--accent); }
  section[id] { scroll-margin-top:58px; }
  @media (max-width:560px) {
    .sec-nav { flex-wrap:nowrap; overflow-x:auto; -webkit-overflow-scrolling:touch; gap:7px; }
    .sec-nav a { font-size:12px; padding:6px 12px; }
  }

  /* ── 모바일 최적화 ── */
  @media (max-width:560px) {
    /* 좁은 화면의 글 왼쪽 선은 하나다. 바깥 여백(14) + 카드 안쪽 여백(18) = 32px 에
       모든 글이 맞도록, 카드 밖에 있는 것들은 그만큼 안으로 들여 쓴다 */
    body { padding:0 14px 64px; }
    .wrap { max-width:100%; }
    /* 롤업 카드는 ucard와 같은 상자라 들여 쓰지 않는다 — 상자끼리 왼쪽 선이 맞아야 한다 */
    header, footer, .sec-head, .sec-desc { padding-left:18px; padding-right:18px; }
    header { padding:34px 18px 4px; }
    h1 { letter-spacing:-.03em; }
    .lede { font-size:14px; }
    .meta-row { gap:5px 16px; margin-top:18px; }
    section { margin-top:40px; }
    h2.sec-title { font-size:20px; }
    .ucard { padding:20px 18px 18px; border-radius:12px; margin-bottom:14px; }
    .ucard h2 { font-size:20px; line-height:1.3; }
    .uc-oneliner { font-size:15px; padding-left:12px; margin-bottom:16px; }
    .uc-points li { font-size:13px; line-height:1.55; }
    .stat .s-val { font-size:17px; }
    .stat .s-label { font-size:10.5px; }
    .uc-links { gap:8px; }
    .uc-links a { padding:11px 14px; font-size:13px; flex:1 1 45%; justify-content:center; }
    footer { margin-top:44px; }
  }
  @media (max-width:480px) {
    .stat-grid { grid-template-columns:1fr; }
    .stat:nth-child(odd) { border-right:none; }
    .stat:nth-last-child(2):nth-child(odd) { border-bottom:1px solid var(--line); }
    .stat:last-child { border-bottom:none; }
  }

  .xlink{display:inline-block;margin-top:12px;font-size:.82rem;font-weight:700;color:var(--accent);text-decoration:none}
  .xlink:hover{text-decoration:underline}

  .tbl-wrap{overflow-x:auto;margin:8px 0 4px;-webkit-overflow-scrolling:touch}
  .uc-tbl{border-collapse:collapse;width:100%;min-width:520px;font-size:.86rem}
  .uc-tbl th,.uc-tbl td{text-align:left;vertical-align:top;padding:9px 12px;border-bottom:1px solid var(--line)}
  .uc-tbl th{font-size:.74rem;font-weight:800;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase;
             border-bottom:1px solid var(--line)}
  .uc-tbl td:first-child{font-weight:800;color:var(--ink);white-space:nowrap}
  /* 파란 글씨는 링크로 읽힌다 — 진짜 티커 열에만 쓴다 */
  .uc-tbl.tick td:nth-child(2){font-weight:800;color:var(--accent);white-space:nowrap;font-variant-numeric:tabular-nums}
  .uc-tbl td:nth-child(2){font-weight:700;color:var(--ink)}
  .uc-tbl tr:last-child td{border-bottom:0}
  /* 반론·충돌 — 한 편만 읽고 결론 내리지 않게, 같은 대시보드의 다른 편이나
     SemiAnalysis 코퍼스와 어긋나는 지점을 카드 안에 박아 둔다 */
  .clash{margin:14px 0 0;border-left:3px solid var(--warn,#c2831f);background:var(--warnbg,#fdf6e6);
         border-radius:0 10px 10px 0;padding:11px 14px}
  @media (prefers-color-scheme:dark){.clash{background:#2b2416;border-left-color:#d9a441}}
  .clash .ch{font-size:var(--t-lbl,10.5px);font-weight:800;letter-spacing:.06em;color:#9a6a12;margin:0 0 6px}
  @media (prefers-color-scheme:dark){.clash .ch{color:#e0b256}}
  .clash ul{margin:0;padding-left:17px}
  .clash li{font-size:.84rem;line-height:1.6;color:var(--ink-2);margin-bottom:5px}
  .clash li:last-child{margin-bottom:0}
  .clash li b{color:var(--ink)}
  .clash .who{display:inline-block;font-size:.68rem;font-weight:800;padding:1px 7px;border-radius:999px;
              background:rgba(154,106,18,.13);color:#9a6a12;margin-right:6px;vertical-align:1px;white-space:nowrap}
  @media (prefers-color-scheme:dark){.clash .who{background:rgba(224,178,86,.16);color:#e0b256}}
  /* 국내·해외 필터 — 카드에 data-scope가 있을 때만 생긴다.
     목차(.sec-nav)가 이미 sticky라 그 위에 한 층 더 붙이고 목차를 아래로 민다 */
  .scope-tabs{position:sticky;top:0;z-index:21;display:flex;gap:8px;flex-wrap:wrap;
              padding:10px 0 9px;margin:0;background:var(--paper)}
  /* 섹션 고르기 — 칩을 좌우로 늘어놓는 대신 눌러서 아래로 펼치는 목록 */
  .sec-pick{position:sticky;top:0;z-index:20;background:var(--paper);padding:0 0 10px;
            margin:0 0 6px;border-bottom:1px solid var(--line)}
  .scope-tabs ~ .sec-pick{top:55px}
  .sp-btn{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:13px;font-weight:800;
          cursor:pointer;padding:9px 14px;border-radius:12px;border:1px solid var(--line);
          background:var(--surface);color:var(--ink);text-align:left}
  .sp-btn:hover{border-color:var(--ink-3)}
  .sp-btn .sp-cnt{margin-left:auto;font-weight:700;color:var(--ink-3)}
  .sp-btn .sp-caret{margin-left:auto;color:var(--ink-3);transition:transform .15s ease}
  .sec-pick.open .sp-btn{border-color:var(--accent);color:var(--accent-ink)}
  .sec-pick.open .sp-caret{transform:rotate(180deg)}
  .sp-list{position:absolute;left:0;right:0;top:calc(100% - 4px);margin:0;padding:6px;list-style:none;
           background:var(--surface);border:1px solid var(--line);border-radius:12px;
           box-shadow:0 8px 24px rgba(26,34,51,.13);max-height:60vh;overflow-y:auto;z-index:30}
  .sp-list li{margin:0}
  .sp-list button{display:flex;align-items:center;gap:8px;width:100%;font:inherit;font-size:13px;font-weight:700;
                  cursor:pointer;padding:9px 12px;border:0;border-radius:9px;background:transparent;
                  color:var(--ink-2);text-align:left}
  .sp-list button:hover{background:var(--sunk);color:var(--ink)}
  .sp-list button .cnt{margin-left:auto;font-weight:700;color:var(--ink-3)}
  .sp-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink)}
  .sp-sep{height:1px;background:var(--line);margin:5px 4px}
  .scope-tabs button{font:inherit;font-size:12.5px;font-weight:700;cursor:pointer;padding:7px 15px;
                     border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
  .scope-tabs button:hover{color:var(--ink);border-color:var(--ink-3)}
  .scope-tabs button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);
                                          color:var(--accent-ink)}
  .scope-tabs .cnt{font-weight:800;opacity:.75;margin-left:5px}
  /* 목차 칩은 이동이 아니라 그 섹션만 보는 토글이다 — 한 번 더 누르면 풀린다 */
  section[hidden]{display:none}
  /* 제목 밑 한 줄 — 이 편을 열면 무엇을 알게 되는지 */
  .uc-gain{margin:5px 0 8px;font-size:13.5px;line-height:1.55;color:var(--ink-3);font-weight:500}
  /* 카드 접기 — 기본은 제목만, 머리를 누르면 펴진다 */
  .uc-head{position:relative;cursor:pointer;padding-right:28px}
  .uc-head:hover h2{color:var(--accent-ink)}
  .uc-head:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:8px}
  .uc-caret{position:absolute;right:2px;top:2px;font-size:15px;color:var(--ink-3);
            transition:transform .15s ease}
  .ucard.is-open .uc-caret{transform:rotate(180deg)}
  .ucard.is-fold:not(.is-open) .uc-body{display:none}
  .ucard.is-fold:not(.is-open) .uc-meta{margin-bottom:0}
  .ucard.is-fold:not(.is-open){padding-bottom:16px}

  /* rollup:start */
  .rollup{margin:0 0 18px;}
  .rlrep{background:var(--card, var(--surface)); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin-bottom:8px;}
  .rlrep[open]{padding-bottom:14px;}
